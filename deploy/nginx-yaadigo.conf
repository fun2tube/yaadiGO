# /etc/nginx/sites-available/yaadigo — replaces the "Coming Soon" config for
# these hosts only. HTTPS is added afterwards by:
#   certbot --nginx -d yaadigo.com -d www.yaadigo.com
# (add -d corporate.yaadigo.com once its DNS record exists).

server {
    listen 80;
    listen [::]:80;
    server_name yaadigo.com www.yaadigo.com corporate.yaadigo.com;

    # Photo uploads from the admin media library.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # src/proxy.js picks the corporate site by Host, so it must pass through.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # PDF rendering and the AI quote draft can take a while.
        proxy_read_timeout 120s;
    }
}
